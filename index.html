  .plan-card{border:2px solid var(--line);border-radius:20px;padding:34px 28px;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 4px 16px rgba(74,27,12,.05);}

  .plan-cta{border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;background:var(--ink);color:#fff;letter-spacing:.01em;transition:transform .12s ease, opacity .12s ease;}

  .plan-card.highlight .plan-cta{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(216,90,48,.35);}

  .store-page{max-width:760px;margin:0 auto;padding:0 28px 60px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;margin:22px 0 18px;font-size:14px;font-weight:500;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;padding:0;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ppoelkclmuqojgjrzpkw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwb2Vsa2NsbXVxb2pnanJ6cGt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTk5OTEsImV4cCI6MjEwNDczNTk5MX0.t8b2FiDioq4YoIYV-8kAEo285IH2lSzjJEIFAzeis3k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_COLORS = { "Moda":"#F5C4B3", "Alimentação":"#FAC775", "Beleza":"#F4C0D1", "Serviços":"#CECBF6" };
const CATS = ["Moda","Alimentação","Beleza","Serviços"];
const MAX_FEATURED = 6;

let STORES = [];
let OFFERS = [];
let activeCat = "Todos";

async function loadOffers(){
  const { data, error } = await sb.from('affiliate_products').select('title, price, image_url, affiliate_url').eq('active', true).order('sort_order');
  if(error){ console.error('Erro ao carregar produtos afiliados:', error); OFFERS = []; return; }
  OFFERS = (data || []).map(o => ({
    title: o.title,
    price: o.price,
    thumbnail: o.image_url,
    url: o.affiliate_url
  }));
}
let searchTerm = "";
let carouselTimer = null;

function formatHours(start, end){
  if(!start || !end) return 'Horário não informado';
  return `${start.slice(0,5)} às ${end.slice(0,5)}`;
}

async function loadStores(){
  const { data, error } = await sb
    .from('stores')
    .select('id, name, address, whatsapp_phone, hours_start, hours_end, description, plan_id, promo_text, promo_expires_at, categories(name)')
    .eq('status', 'active');
  if(error){ console.error('Erro ao carregar lojas:', error); STORES = []; return; }
  const today = new Date().toISOString().slice(0,10);
  STORES = (data || []).map(s => {
    const catName = s.categories ? s.categories.name : '';
    const promoActive = !!s.promo_text && (!s.promo_expires_at || s.promo_expires_at >= today);
    return {
      id: s.id, name: s.name, category: catName, address: s.address, phone: s.whatsapp_phone,
      hours: formatHours(s.hours_start, s.hours_end), description: s.description || '',
      destaque: s.plan_id === 'perto_mais' || s.plan_id === 'perto_top',
      color: CATEGORY_COLORS[catName] || '#EDE1D4',
      promo: promoActive ? s.promo_text : null
    };
  });
}

function iconSearch(){ return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`; }
function iconPin(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:2px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`; }
function iconWpp(){ return `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3A8.86 8.86 0 0 0 12.05 4a8.94 8.94 0 0 0-7.75 13.4L3 21l3.7-1.24a8.9 8.9 0 0 0 5.35 1.8h.01a8.94 8.94 0 0 0 8.94-8.9 8.85 8.85 0 0 0-3.4-6.36zM12.05 20a7.4 7.4 0 0 1-3.8-1.04l-.27-.16-2.84.94.93-2.75-.18-.28a7.43 7.43 0 0 1 6.16-11.4 7.34 7.34 0 0 1 5.2 2.16 7.35 7.35 0 0 1 2.17 5.22A7.43 7.43 0 0 1 12.05 20z"/></svg>`; }

function pickFeatured(all){
  if(all.length <= MAX_FEATURED) return all;
  const dayIndex = Math.floor(Date.now() / (1000*60*60*24));
  const start = (dayIndex * MAX_FEATURED) % all.length;
  return all.slice(start).concat(all.slice(0, start)).slice(0, MAX_FEATURED);
}

function gridContentHtml(list){
  if(!list.length) return emptyStateHtml();
  const adBanner = `
    <div class="ad-slot" style="grid-column:1/-1;margin:0;">
      <div class="ad-slot-inner"><!-- AD_SLOT_FEED --> Espaço de anúncio</div>
    </div>
  `;
  const cards = list.map(cardHtml);
  if(cards.length > 3){
    cards.splice(3, 0, adBanner);
  }
  return cards.join('');
}

function cardHtml(s){
  return `
    <div class="card" data-id="${s.id}">
      <div class="card-photo" style="background:${s.color}20">
        ${s.promo ? `<span class="promo-ribbon">🔥 Promo</span>` : ''}
        ${s.destaque ? `<span class="badge-destaque">destaque</span>` : ''}
        Foto da loja
      </div>
      <div class="card-body">
        <h3>${s.name}</h3>
        <p class="cat">${s.category}</p>
        <p class="addr">${iconPin()}${s.address}</p>
      </div>
    </div>
  `;
}

function featSlideHtml(s){
  return `
    <div class="feat-slide" data-id="${s.id}">
      <div class="feat-photo" style="background:${s.color}30">Foto da loja</div>
      <div class="feat-info">
        <span class="feat-badge">★ destaque</span>
        <h3>${s.name}</h3>
        <p class="cat">${s.category}</p>
        <p class="addr">${iconPin()}${s.address}</p>
      </div>
    </div>
  `;
}

function setupCarousel(featured){
  const track = document.getElementById('carouselTrack');
  const dots = document.querySelectorAll('#carouselDots .dot');
  let idx = 0;
  function goTo(i){
    idx = (i + featured.length) % featured.length;
    track.style.transform = `translateX(-${idx * 100}%)`;
    dots.forEach((d,j)=> d.classList.toggle('active', j===idx));
  }
  function next(){ goTo(idx + 1); }
  function prev(){ goTo(idx - 1); }
  document.querySelectorAll('.feat-slide').forEach(el=>{
    el.addEventListener('click', ()=> renderStore(el.dataset.id));
  });
  dots.forEach(d=> d.addEventListener('click', ()=> { goTo(parseInt(d.dataset.i)); resetTimer(); }));
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  if(nextBtn) nextBtn.addEventListener('click', e=>{ e.stopPropagation(); next(); resetTimer(); });
  if(prevBtn) prevBtn.addEventListener('click', e=>{ e.stopPropagation(); prev(); resetTimer(); });
  function resetTimer(){
    if(carouselTimer) clearInterval(carouselTimer);
    if(featured.length > 1) carouselTimer = setInterval(next, 4000);
  }
  resetTimer();
}

function renderStore(id){
  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }
  const s = STORES.find(x=>x.id===id);
  sb.rpc('increment_store_view', { p_store_id: id }).then(({error})=>{ if(error) console.error(error); });

  const catColors = { "Moda":["#E1F5EE","#0F6E56"], "Alimentação":["#FAEEDA","#633806"], "Beleza":["#FBEAF0","#4B1528"], "Serviços":["#EEEDFE","#3C3489"] };
  const [bg, fg] = catColors[s.category] || ["#EDE1D4", "#2C1810"];

  app.innerHTML = `
    <div class="store-page">
      <button class="back-btn" id="backBtn">&larr; Voltar para a vitrine</button>
      <div class="store-hero" style="background:${s.color}30">Foto da loja</div>
      <span class="store-cat-pill" style="background:${bg};color:${fg}">${s.category}</span>
      <h1>${s.name}</h1>
      ${s.promo ? `<div class="promo-banner">🔥 ${s.promo}</div>` : ''}
      <p class="store-desc">${s.description}</p>

      <div class="ad-slot" style="padding:0;margin-bottom:22px;">
        <div class="ad-slot-inner"><!-- AD_SLOT_STORE_PAGE --> Espaço de anúncio</div>
      </div>

      <div class="info-grid">
        <div class="info-card"><p class="label">Endereço</p><p class="value">${s.address}</p></div>
        <div class="info-card"><p class="label">Horário</p><p class="value">${s.hours}</p></div>
      </div>

      <button class="wpp-btn" id="wppBtn">${iconWpp()} Chamar no WhatsApp</button>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', renderHome);
  document.getElementById('wppBtn').addEventListener('click', ()=>{
    sb.rpc('increment_store_whatsapp_click', { p_store_id: id }).then(({error})=>{ if(error) console.error(error); });
    const msg = encodeURIComponent(`Olá! Vi a ${s.name} no Vitrine Certa e gostaria de saber mais.`);
    window.open(`https://wa.me/${s.phone}?text=${msg}`, '_blank');
  });
  window.scrollTo(0,0);
}

(async function init(){
  app.innerHTML = `<p style="padding:60px 28px;text-align:center;color:var(--ink-soft);">Carregando lojas...</p>`;
  await Promise.all([loadStores(), loadOffers()]);
  renderHome();
})();

}
document.getElementById('acceptCookies').addEventListener('click', ()=>{
  localStorage.setItem('cookieConsent', 'true');
  document.getElementById('cookieBanner').style.display = 'none';
});
